# Contributor License Agreement, self-hosted.
#
# Replaces the hosted cla-assistant.io service, which kept reporting not_signed
# because it checks the GitHub account behind the *commit email* — here
# `verinfast-bot`, not the account that signed. Running it ourselves means the
# signature list is a file in this repo that we can read, fix and audit, rather
# than a record in someone else's database we can only poke at through a badge.
#
# A contributor signs by commenting the exact phrase on their PR. The action
# appends them to a JSON file on a branch and turns the check green.
name: cla

on:
  issue_comment:
    types: [created]
  # pull_request_target, not pull_request: this needs write access to post the
  # status and commit the signature, and a fork PR's `pull_request` token is
  # read-only. It is safe here ONLY because this job never checks out or runs
  # the pull request's code — it just reads metadata and writes the signature
  # file. Do not add a checkout of the PR head to this workflow.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write          # to commit the signature file
  pull-requests: write     # to comment
  statuses: write          # to set the check

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record the CLA signature
        if: >
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          # The repo-scoped token, not a PAT: signatures live in THIS repo, so
          # nothing needs access to anywhere else.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/VerinFast/waikiki/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          allowlist: 'aylusltd,verinfast-bot,dependabot[bot],*[bot]'
          custom-notsigned-prcomment: >
            Thanks for the contribution. Waikiki is source-available under the
            Elastic License 2.0, and we ask contributors to sign a short CLA
            before we can merge. Please read **[the CLA](https://github.com/VerinFast/waikiki/blob/main/CLA.md)**
            and then comment exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks!'
