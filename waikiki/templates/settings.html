{% extends "base.html" %}
{% block title %}Settings — Waikiki{% endblock %}
{% block content %}
  <h1>Settings</h1>
  <form method="post" action="/settings" class="settings">
    <fieldset>
      <legend>Theme</legend>
      <select name="theme">
        {% for t in themes %}
          <option value="{{ t }}" {{ 'selected' if settings.theme == t }}>{{ t }}</option>
        {% endfor %}
      </select>
    </fieldset>

    <fieldset>
      <legend>Embeddings (RAG)</legend>
      <label>Provider
        <select name="embedder_provider">
          <option value="local" {{ 'selected' if settings.embedder_provider == 'local' }}>
            local — sentence-transformers (offline, no key)</option>
          <option value="voyage" {{ 'selected' if settings.embedder_provider == 'voyage' }}>
            voyage — cloud (Anthropic-recommended, needs VOYAGE_API_KEY)</option>
        </select>
      </label>
      <label>Local model (HuggingFace id)
        <input type="text" name="embedder_local_model"
               value="{{ settings.embedder_local_model }}">
      </label>
      <label>Voyage model
        <input type="text" name="embedder_voyage_model"
               value="{{ settings.embedder_voyage_model }}">
      </label>
      <label class="rag-toggle">
        <input type="checkbox" name="reindex" value="1"> re-embed all pages on save
      </label>
      <p class="muted note">Changing the embedder changes the vector dimension, so the
        vector index is rebuilt and all pages are re-embedded automatically.</p>
    </fieldset>

    <button class="btn primary" type="submit">Save settings</button>
  </form>
{% endblock %}
